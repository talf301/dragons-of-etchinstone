<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#102821" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Dragons of Etchinstone</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <span class="mark" aria-hidden="true">◇</span><strong>Etchinstone</strong
      ><button id="printed" aria-label="View printed cards">Cards</button
      ><button id="journal" aria-label="Open expedition journal">Journal</button
      ><button id="help" aria-label="How to play">?</button>
    </header>
    <main id="app"></main>
    <dialog id="panel">
      <form method="dialog">
        <button autofocus class="close">Close</button>
      </form>
      <div id="details"></div>
    </dialog>
    <div aria-live="polite" id="status"></div>
    <script type="module" src="./app.mjs"></script>
  </body>
</html>
